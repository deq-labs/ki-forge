[project]
name = "kiforge-api"
version = "0.1.0"
description = "Ki Forge API, worker and rules engine"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.162",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py315"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
